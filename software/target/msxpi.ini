; MSXPi server configuration - TEMPLATE
;
; The real file lives on the Pi at /home/pi/msxpi/msxpi.ini and is NOT in this
; repository. This copy carries the working defaults, with the credentials
; blanked - fill those in on the Pi, never here.
;
; Set a value from the MSX with
;     p set <NAME> <value>
; which rewrites the file on the Pi, or edit it there directly and restart the
; server.
;
; Blank credentials simply disable what needs them: the stock providers each
; report themselves unavailable rather than failing mid-request, and ChatGPT
; says which variable is missing.
;
; Blanked here: WIFISSID, WIFIPWD, OPENAIKEY, RAPIDAPIKEY, FINNHUBKEY,
; TWELVEDATAKEY, ALPHAVANTAGEKEY.

var PATH=https://www.msxarchive.nl/pub/msx/games/roms/msx1/
var DriveA=/home/pi/msxpi/disks/msxpiboot.dsk
var DriveB=/home/pi/msxpi/disks/tools.dsk
var DriveM=http://192.168.50.12:8000
var DriveR1=https://www.msxarchive.nl/pub/msx/games/roms/msx1
var DriveR2=https://www.msxarchive.nl/pub/msx/games/roms/msx2
var WIDTH=80
var WIFISSID=
var WIFIPWD=
var WIFICOUNTRY=GB
var DSKTMPL=/home/pi/msxpi/disks/blank.dsk
var IRCNICK=msxpi
var IRCADDR=chat.freenode.net
var IRCPORT=6667
var SPI_HW=False
var SPI_CS=21
var SPI_SCLK=20
var SPI_MOSI=16
var SPI_MISO=12
var RPI_READY=25
var OPENAIKEY=
var M:=http://localhost:14230
var M=http://localhost:14230
var RAPIDAPIKEY=
var RAPIDAPIHOST=apidojo-yahoo-finance-v1.p.rapidapi.com
var FINNHUBKEY=
var TWELVEDATAKEY=
var ALPHAVANTAGEKEY=
